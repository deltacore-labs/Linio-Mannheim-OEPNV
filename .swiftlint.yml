# SwiftLint Configuration for Linio (RNV Transport App)
# Version: 1.0

disabled_rules:
  - line_length # Handled by Xcode formatting
  - trailing_whitespace # Auto-fixed by Xcode
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - convenience_type
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - nimble_operator
  - nslocalizedstring_key
  - number_separator
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - single_test_class
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strong_iboutlet
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - xct_specific_matcher
  - yoda_condition

# Analyzer rules (requires --analyze flag)
analyzer_rules:
  - unused_import
  - unused_declaration

# Paths to include
included:
  - Linio
  - LinioTests
  - LinioWatch
  - LinioWatchTests
  - LinioLiveActivity

# Paths to exclude
excluded:
  - Linio/GraphQL/Generated
  - LocalPackages
  - Pods
  - .build
  - build
  - DerivedData

# Configuration
force_cast: warning
force_try: warning
function_body_length:
  warning: 60
  error: 100
function_parameter_count:
  warning: 6
  error: 10
type_body_length:
  warning: 400
  error: 600
file_length:
  warning: 600
  error: 1200
  ignore_comment_only_lines: true
cyclomatic_complexity:
  warning: 15
  error: 25
nesting:
  type_level: 2
  function_level: 3
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 60
    error: 80
  excluded:
    - id
    - i
    - j
    - x
    - y
    - ok
    - to
large_tuple:
  warning: 4
  error: 6
type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60
  excluded:
    - ID

# Custom rules
custom_rules:
  no_print_in_production:
    regex: "^\\s*print\\("
    message: "Use DebugLog instead of print() for consistent logging"
    severity: warning
    match_kinds:
      - identifier
  
  mark_section_spacing:
    regex: "// MARK: -(?! )"
    message: "MARK comments should have a space after the hyphen"
    severity: warning
    
  todo_fixme_format:
    regex: "(TODO|FIXME)(?!:)"
    message: "TODO/FIXME should be followed by a colon"
    severity: warning

reporter: xcode
